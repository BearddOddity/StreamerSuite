[package]
name = "chatconfluence"
version = "0.1.0"
edition = "2021"

[lib]
name = "chatconfluence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "protocol-asset", "devtools", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "cookies"] }
tungstenite = "0.30.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.9"
keyring = "4"
dirs = "5"
hostname = "0.4"
forge-detection = { path = "../forge-detection" }
sysinfo = "0.33"
once_cell = "1.19"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
url = "2.5"
base64 = "0.22"
thiserror = "2"
urlencoding = "2"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.13"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["std"] }
